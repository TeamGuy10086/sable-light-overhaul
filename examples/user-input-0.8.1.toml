#Advanced: Lamb area lights (falls back to Legacy if unavailable). Legacy: original block propagation. None: disable this mod client effects.
#Allowed Values: Advanced, Legacy, None
lightingMode = "Advanced"

[autocannon]
	#Visible flame size. Existing configured values are preserved.
	# Default: 5.0
	# Range: 0.1 ~ 16.0
	sizeMultiplier = 9.0
	#Visible flame opacity.
	# Default: 1.0
	# Range: 0.1 ~ 1.0
	flameOpacity = 1.0
	#Visible lifetime in ticks; new shots only.
	# Default: 3
	# Range: 1 ~ 20
	flameDurationTicks = 3
	#Block light lifetime; starts at level 15.
	# Default: 5
	# Range: 1 ~ 40
	lightDurationTicks = 5
	# Default: 3
	# Range: 1 ~ 7
	lightSourceCount = 5
	#Total axial span in blocks, ahead of muzzle.
	# Default: 3.0
	# Range: 0.0 ~ 24.0
	lightLength = 3.0
	#Total lateral span; requires 5 or more sources.
	# Default: 0.0
	# Range: 0.0 ~ 24.0
	lightWidth = 1.5
	#Visible length relative to 0.4, independent of sizeMultiplier and lighting span.
	# Default: 0.8
	# Range: 0.1 ~ 3.0
	flameLengthScale = 0.5
	#Visible width relative to 0.4, independent of sizeMultiplier and lighting span.
	# Default: 1.3
	# Range: 0.1 ~ 3.0
	flameWidthScale = 2.0

[bigCannonLight]
	#Maximum lifetime; cold/dead tracked smoke may end it earlier.
	# Default: 20
	# Range: 1 ~ 1200
	durationTicks = 30
	#Fraction of initial brightness.
	# Default: 0.25
	# Range: 0.0 ~ 1.0
	minimumBrightness = 0.0
	#Fraction of INITIAL brightness subtracted per tick AFTER peak hold.
	# Default: 0.05
	# Range: 0.0 ~ 1.0
	decayPerTick = 0.02
	#Keep peak brightness before decay begins.
	# Default: 4
	# Range: 0 ~ 1200
	peakHoldTicks = 4
	#Sparse layout: 1 center; 3 axial; 5 adds lateral pair; 7 adds vertical pair.
	# Default: 5
	# Range: 1 ~ 7
	lightSourceCount = 7
	#Total axial span around hot smoke, in blocks.
	# Default: 6.0
	# Range: 0.0 ~ 24.0
	lightLength = 6.0
	#Total lateral/vertical span in blocks.
	# Default: 4.0
	# Range: 0.0 ~ 24.0
	lightWidth = 6.0
	#Approximate blocks/tick if no smoke captured; drag=0.95, not exact CBC physics.
	# Default: 0.9
	# Range: 0.0 ~ 4.0
	fallbackSpeed = 0.9
	#Fraction of smoke lifetime treated as hot; approximate, not pixel detection.
	# Default: 0.35
	# Range: 0.05 ~ 1.0
	hotLifetimeFraction = 0.6

[performance]
	#Real particle references per shot, no global particle scan.
	# Default: 8
	# Range: 1 ~ 24
	trackedParticlesPerShot = 8
	#Global light source budget; nearest sources win.
	# Default: 96
	# Range: 7 ~ 448
	maxLightSources = 256

[sableBridge]
	#Experimental Sable 2.0.3 world-to-plot light bridge; no shader edits.
	enabled = true
	#Log active world/projected source counts once per second while firing.
	debugLogging = false
	#Additional projected source budget across all ships; loaded plot chunks only.
	# Default: 96
	# Range: 1 ~ 448
	maxProjectedSources = 96

[advanced]
	#Log area counts once per second during firing; keep disabled for profiling.
	debugLogging = false
	#Distance from hot cloud to forward zero-light boundary.
	# Default: 30.0
	# Range: 1.0 ~ 48.0
	bigForwardRange = 25.0
	# Default: 8.0
	# Range: 1.0 ~ 32.0
	bigRearRange = 8.0
	#Lateral radius, not diameter.
	# Default: 12.0
	# Range: 1.0 ~ 32.0
	bigLateralRadius = 12.0
	# Default: 10.0
	# Range: 1.0 ~ 32.0
	autoForwardRange = 32.0
	#Retained for old configs; Advanced cones have no rear illumination.
	# Default: 4.0
	# Range: 1.0 ~ 16.0
	autoRearRange = 16.0
	# Default: 6.0
	# Range: 1.0 ~ 16.0
	autoLateralRadius = 16.0
	#Spatial peak core fraction; independent of temporal fading.
	# Default: 0.25
	# Range: 0.0 ~ 0.9
	brightCoreFraction = 0.25
	#Advanced-only peak hold; zero preserves brief flashes during rapid fire.
	# Default: 0
	# Range: 0 ~ 20
	autoPeakHoldTicks = 1
	# Default: 0.5
	# Range: 0.01 ~ 1.0
	autoDecayPerTick = 0.5
	#Nearest active world area lights.
	# Default: 8
	# Range: 1 ~ 32
	maxAreaLights = 32
	#Additional area/ship pairs, sorted by world light distance then ship UUID.
	# Default: 16
	# Range: 1 ~ 64
	maxReceiverAreas = 64
	#Fraction of remaining radius used by the faster linear middle, after the core.
	# Default: 0.55
	# Range: 0.05 ~ 0.95
	middleFalloffFraction = 0.55
	#Brightness at the start of the slow outer tail; slope is capped to keep tail slower than middle.
	# Default: 0.2
	# Range: 0.01 ~ 0.9
	tailStartBrightness = 0.2
	#Forward cone half-angle in degrees; radius also limited by autoLateralRadius.
	# Default: 18.0
	# Range: 3.0 ~ 60.0
	autoConeHalfAngle = 60.0
	#CBC effective charge power that reproduces configured big ranges. Blast radius scales linearly with power / reference.
	# Default: 4.0
	# Range: 0.25 ~ 32.0
	bigReferenceCharge = 2.0
	#Native smoke rendered quad half-size that reproduces configured big ranges. Fallback: plume size / 4.
	# Default: 1.0
	# Range: 0.1 ~ 32.0
	bigReferenceSmokeSize = 2.0
	#Maximum forward, rear or lateral reach after size scaling; larger values increase render rebuild work.
	# Default: 64.0
	# Range: 8.0 ~ 96.0
	bigMaximumRange = 64.0
