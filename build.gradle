plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}
group = 'dev.cbcmuzzlelight'
version = '0.11.0-alpha'
base { archivesName = 'cbc-muzzle-light' }
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
neoForge {
    version = '21.1.228'
    runs { client { client() }; server { server(); programArgument '--nogui' } }
    mods { cbcmuzzlelight { sourceSet sourceSets.main } }
}
repositories { mavenCentral() }
dependencies {
    compileOnly files('libs/cbc.jar', 'libs/sable.jar', 'libs/sable-companion.jar', 'libs/lamb-api.jar', 'libs/lamb-runtime.jar')
    compileOnly files('libs/yuushya.jar')
    compileOnly files('libs/iris.jar')
    // LDLib2 is the page toolkit Synaxis uses; it stays optional, so this is compile-only.
    // taffy and yoga are jar-in-jar inside it and must be extracted by prepare-libs.ps1.
    compileOnly files('libs/ldlib2.jar', 'libs/taffy.jar', 'libs/yoga.jar')
    compileOnly fileTree(dir: 'libs/lamb-deps', include: '*.jar')
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.ow2.asm:asm-tree:9.8'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
tasks.named('test') { useJUnitPlatform() }
tasks.named('jar') {
    from('LICENSE')
    manifest { attributes('Implementation-Version': project.version) }
}
// The mod metadata must carry the real version: the jar file name alone is not what the game shows
// in the mod list, so keeping the toml literal is how the in-game version silently went stale.
tasks.named('processResources', ProcessResources) {
    def expandProps = [version: project.version]
    inputs.properties(expandProps)
    filesMatching('META-INF/neoforge.mods.toml') { expand(expandProps) }
}

sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.compileClasspath
